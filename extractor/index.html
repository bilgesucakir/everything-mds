<script>const DATA={"domains": {"general": "working rules for any project", "web": "websites and web apps", "ios": "iPhone apps and the App Store", "backend": "APIs and servers", "ops": "hosting, domains, monitoring, costs", "design": "assets, fonts, visual design"}, "parts": {"working-agreements": "how the assistant should behave", "conventions": "how work is organised", "stack-rules": "rules tied to a specific tool or host", "checklists": "tick-box reviews", "templates": "fill-in documents", "playbooks": "ordered steps", "reference": "facts, specs, case studies"}, "files": [{"path": "app-review/app-store-review-checklist.md", "title": "App Store review checklist (iOS)", "adapt": "iOS only.", "sections": [{"heading": "", "domains": ["ios"], "parts": ["checklists"], "text": "# App Store review checklist (iOS)\n\nA practical checklist for getting a first iOS app through App Review. Written after shipping a first version and answering a \"Guideline 2.1 \u2013 Information Needed\" request.\n\n- **Last verified:** 2026-10-18 against the App Review Guidelines revision of **2026-10-16** (the newest on Apple's developer news page that day; guidelines 1.2, 2.3.14 and 2.5.19 were added or changed in it). Apple changes the rules and the App Store Connect screens often, so before each submission check https://developer.apple.com/news/ for a newer revision. Treat anything below as a starting point and check the sources at the end.\n- **Mark items** `[x]` when done. Items marked **(check)** change often, so confirm them in App Store Connect or Apple's docs.\n\n---"}, {"heading": "0. Before you start (every submission)", "domains": ["ios"], "parts": ["checklists"], "text": "## 0. Before you start (every submission)\n\n- [ ] **Check whether there is a new release of the App Review Guidelines.** Open https://developer.apple.com/news/ and look for \"Updated App Review Guidelines\" newer than the revision this checklist was verified against (see \"Last verified\" above). If there is one, read what changed in https://developer.apple.com/app-store/review/guidelines/ and update the checklist items that are affected before you submit.\n- [ ] Also check the same news page for a new Apple Developer Program License Agreement and for new minimum Xcode/SDK requirements."}, {"heading": "1. Accounts and agreements", "domains": ["ios"], "parts": ["checklists"], "text": "## 1. Accounts and agreements\n\n- [ ] Apple Developer Program membership is active.\n- [ ] The latest Program License Agreement is accepted (App Store Connect shows a banner when a new one is waiting; releasing can be blocked until it is accepted).\n- [ ] EU trader status (DSA) is declared (Business \u2192 Compliance) if the app is sold in the EU. **(check)**\n- [ ] A contact email that you read exists and is the same everywhere (App Store listing, support page, privacy policy, review contact)."}, {"heading": "2. Build", "domains": ["ios"], "parts": ["checklists"], "text": "## 2. Build\n\n- [ ] Built with the Xcode and SDK version Apple currently requires for new submissions. **(check)**\n- [ ] Know which SDK you build with: moving to the iOS 27.1 SDK triggers the iPhone Duo screenshot requirement (from April 2027). **(check)**\n- [ ] Every target (app, widgets, extensions) has the **same version and build number**.\n- [ ] Build number is **higher than every build ever uploaded**, even rejected or unused ones.\n- [ ] Release configuration archive, destination \"Any iOS Device (arm64)\", signed, uploaded through Organizer or Transporter.\n- [ ] `ITSAppUsesNonExemptEncryption` is set (usually `NO` if you only use standard HTTPS), so the export question is not asked on every upload.\n- [ ] Tested on a **real device** on the latest iOS, from a fresh install (not just the simulator).\n- [ ] No crashes, no dead buttons, no placeholder text, no \"coming soon\" screens.\n- [ ] Works on a slow or offline connection: clear message, no endless spinner.\n- [ ] Works with permissions **denied** (a refused permission must not break the app).\n- [ ] IPv6-only networks work (use host names, not IPv4 addresses).\n- [ ] The backend the app talks to is **live and stays live** for the whole review. Do not deploy or change it while the app is in review."}, {"heading": "3. Permissions and privacy in the app", "domains": ["ios"], "parts": ["checklists"], "text": "## 3. Permissions and privacy in the app\n\n- [ ] Every permission has a clear, specific purpose string (what and why), in each language you ship.\n- [ ] Permissions are asked **in context** (when the user taps the feature), not all at launch.\n- [ ] Photo access: prefer the system photo picker (no permission needed); ask only for what you really need.\n- [ ] Privacy policy is linked **inside the app** and in App Store Connect, and the page is public and working.\n- [ ] Privacy manifest (`PrivacyInfo.xcprivacy`) is in the app target and matches what the app really does; third-party SDKs ship their own.\n- [ ] If sign-up exists: **in-app account deletion** that really deletes the account and its data (not \"email us\", not \"deactivate\").\n- [ ] Optional but expected by users: a way to download their data.\n- [ ] No tracking prompt unless you really track across apps.\n- [ ] Ask for ratings only with Apple's own system prompt (it is shown a limited number of times per year); no custom \"rate us\" popups that steer people to give five stars. **(check the guideline number: sources disagree)**"}, {"heading": "4. Accounts and user content", "domains": ["ios"], "parts": ["checklists"], "text": "## 4. Accounts and user content\n\n- [ ] If an account is not needed for the core features, allow use without one; otherwise say in the review notes why it is needed.\n- [ ] Sign in with Apple is offered **if** you offer another third-party login (Google, Facebook, ...). Plain email and password does not trigger it.\n- [ ] **User-generated content** (anything other users can see): filtering, a report button, blocking, published contact details (Guideline 1.2). If content is private to each user, say so clearly in the review notes. The 2026-10-16 update also covers non-consensual intimate imagery, including AI-generated.\n- [ ] No hidden, dormant or undocumented features (Guideline 2.5.19). Anything surprising (secret badges, easter eggs, remote-enabled features) is mentioned in the notes.\n- [ ] Features that arrive after review (server-driven content, remote flags) do not change what the app does in a way App Review has not seen."}, {"heading": "5. Third-party content", "domains": ["ios"], "parts": ["checklists"], "text": "## 5. Third-party content\n\n- [ ] You have the right to use every image, sound, text and data set. Keep a list of sources and licences.\n- [ ] Creative Commons and similar licences: show the credit and licence in the app where required; respect NonCommercial, NoDerivatives and ShareAlike terms.\n- [ ] Answer **Content Rights** in App Store Connect honestly (yes if the app uses third-party content).\n- [ ] APIs you call have terms that allow your use; note keys and quotas."}, {"heading": "6. App Store Connect listing", "domains": ["ios"], "parts": ["checklists"], "text": "## 6. App Store Connect listing\n\n- [ ] Name, subtitle, keywords (no competitor names, no keyword stuffing), description (only features that exist), promotional text.\n- [ ] Every localization you ship is complete (including keywords and screenshots).\n- [ ] Support URL works and shows a way to contact you.\n- [ ] Category, copyright line, price (free or paid), availability (countries). **(check countries)**\n- [ ] Age rating questionnaire answered honestly. **(check)**\n- [ ] App Privacy (\"nutrition label\") answered and consistent with the policy, the privacy manifest and the real behaviour. Analytics or crash reporting counts.\n- [ ] Accessibility section: claim only what you have tested. Support is usually published only **after** the app has a released version.\n- [ ] Screenshots show the **real app in use** (not only a splash or login screen), use fictional data, and use a size Apple accepts for the slot. **(check sizes; a rejected size shows \"File dimensions are invalid\")**\n- [ ] **iPhone Duo screenshots** (new device): from April 2027 they are required for apps built with the iOS 27.1 SDK or later. If you build with that SDK, add a Duo set. **(check)**\n- [ ] No pricing, URLs, awards or other platforms' logos in screenshots or creative assets (Guideline 2.3.14 for header and search assets).\n- [ ] Optional creative assets (product page header, search results asset) are suitable for all ages. They need the newest OS to show, so treat them as optional."}, {"heading": "7. App Review information", "domains": ["ios"], "parts": ["checklists"], "text": "## 7. App Review information\n\n- [ ] **Demo account** with working credentials, already holding sample data. Keep it working during the review and change its password afterwards.\n- [ ] If sign-up needs email verification, explain it, and make sure the demo account does not.\n- [ ] **Review notes** (use the template below). Be specific; generic notes are rejected (Guideline 2.3.1(a)).\n- [ ] Contact name, phone and email are filled in and monitored.\n- [ ] Attach a **screen recording from a real device** when the flow is not obvious (sign-up, deletion, hardware or location features). File types allowed in the attachment field are listed in App Store Connect; use lowercase extensions (`.mp4`, not `.MP4`).\n- [ ] Release option chosen (manual release is safest for a first version).\n\nUse `review-notes-template.md` for the structure and a worked example. The step-by-step order of work is in `submission-playbook.md`."}, {"heading": "8. If App Review asks for information (Guideline 2.1)", "domains": ["ios"], "parts": ["checklists"], "text": "## 8. If App Review asks for information (Guideline 2.1)\n\nNew developer accounts are often asked for more information. A good reply:\n\n1. Answer **every numbered point** Apple lists, in the same order.\n2. Reply in the Resolution Center **and** paste the same text into the Notes field.\n3. Attach the screen recording to the reply (zip if you have more than one file).\n4. Resubmit (button name varies: \"Update Review\" or \"Resubmit to App Review\").\n5. Do **not** change the build, the demo account or the backend while you wait."}, {"heading": "9. While waiting", "domains": ["ios"], "parts": ["checklists"], "text": "## 9. While waiting\n\n- Status \"Waiting for Review\" can last days, especially after a resubmission or a guideline update. Typical is 24 to 48 hours, but it is not guaranteed.\n- A red mark next to \"App Review\" in the sidebar usually flags a message thread, not a new problem. Read the thread.\n- \"Last updated by Apple\" only means the system touched the record.\n- Do not click \"Remove from Review\" or \"Cancel Submission\" unless you really mean to start over.\n- After about three days with no change, contact Apple through \"Contact Us\" and ask for a status check. Use expedited review only for real emergencies.\n- Use the time to prepare: release notes, site links, a list of things to test on the live listing."}, {"heading": "10. After approval", "domains": ["ios"], "parts": ["checklists"], "text": "## 10. After approval\n\n- [ ] Release (if you chose manual), then check the live listing in the store.\n- [ ] Install from the App Store on a clean device; sign up, use the main flow, delete the account.\n- [ ] Publish accessibility support in App Store Connect if it is waiting for a released version.\n- [ ] Change the demo account password.\n- [ ] Put the store link on your website and README.\n- [ ] Watch crash reports and reviews for the first days.\n- [ ] Next release: describe new features **specifically** in the review notes; keep the privacy label and policy in sync."}, {"heading": "11. Common rejection reasons (quick list)", "domains": ["ios"], "parts": ["checklists"], "text": "## 11. Common rejection reasons (quick list)\n\n| Guideline | Short version |\n|---|---|\n| 2.1 | Crashes, broken flows, missing demo account, information needed |\n| 2.3.1(a) | New features not described in the notes; misleading marketing |\n| 2.3.3 | Screenshots show only a splash or login screen |\n| 2.5.19 | Hidden or undocumented features |\n| 4.8 | Third-party login without an equivalent privacy-friendly option |\n| 5.1.1 | Privacy policy missing, no account deletion, permissions not explained |\n| 1.2 | User content without filtering, reporting, blocking and contact |"}, {"heading": "Sources", "domains": ["ios"], "parts": ["checklists"], "text": "## Sources\n\n- App Review Guidelines: https://developer.apple.com/app-store/review/guidelines/\n- App Store Connect Help: https://developer.apple.com/help/app-store-connect/\n- Apple developer news (guideline updates): https://developer.apple.com/news/\n- Asset best practices: https://developer.apple.com/app-store/asset-best-practices/"}]}, {"path": "app-review/review-notes-template.md", "title": "App Review notes: template and example", "adapt": "iOS only.", "sections": [{"heading": "", "domains": ["ios"], "parts": ["templates"], "text": "# App Review notes: template and example\n\nPaste into **App Store Connect \u2192 App Review Information \u2192 Notes**. Apple asks for the same information when it sends a \"Guideline 2.1 \u2013 Information Needed\" message, and wants it in the Notes too. Keep the text specific; generic descriptions are rejected (Guideline 2.3.1(a)). The Notes field has a size limit (several thousand characters) **(check)**."}, {"heading": "Template", "domains": ["ios"], "parts": ["templates"], "text": "## Template\n\n```\nPURPOSE AND AUDIENCE\n<What the app does, who it is for, what problem it solves.>\n\nHOW TO SIGN IN AND TRY THE MAIN FEATURES\n\u2022 Demo account: credentials are in the Sign-In fields (<n> sample items already added).\n\u2022 <Feature 1>: where to tap, what to choose, what should happen.\n\u2022 <Feature 2>: ...\n\u2022 Registration: <steps; mention email verification and that the demo account does not need it>.\n\u2022 Account deletion: <where it is, what it does>.\n\u2022 Anything that needs a special device, location, email or code, and how to test it.\n\nUSER CONTENT, PAID CONTENT\n\u2022 Is user content private or shared? If shared: filtering, reporting, blocking, contact.\n\u2022 Purchases / subscriptions: none, or where they are.\n\nEXTERNAL SERVICES USED\n\u2022 Backend: <host>, database: <service>, file storage: <service>.\n\u2022 Email: <service> (what it sends).\n\u2022 Data and media: <providers, with credit and licence shown in the app>.\n\u2022 Maps: <provider>. Analytics: none / <service>. Ads: none. AI services: none / <service>.\n\nREGIONS\n<Same in all regions, or what differs.> Languages: <list>.\n\nREGULATED OR PROTECTED MATERIAL\n<None, or the documents you attach.>\n\nSUPPORT\n<email>, <support page URL>\n```"}, {"heading": "Example (fictional app \"Trailmark\", a hiking diary)", "domains": ["ios"], "parts": ["templates"], "text": "## Example (fictional app \"Trailmark\", a hiking diary)\n\n```\nPURPOSE AND AUDIENCE\nTrailmark is a private hiking diary for iPhone. It is for hikers who want to remember\nroutes, photos and notes. Entries appear on the user's own map and list.\n\nHOW TO SIGN IN AND TRY THE MAIN FEATURES\n\u2022 Use the demo account in the Sign-In fields (8 hikes already added).\n\u2022 Add a hike: Map tab > \"+\" > choose a photo, a place and a date > Save.\n\u2022 Registration: Welcome > Create account. A verification link is emailed; the demo account needs no registration.\n\u2022 Delete account: Profile > Settings > Delete Account (asks to confirm).\n\nUSER CONTENT, PAID CONTENT\n\u2022 Entries and photos are private. There is no feed, sharing, comments or messaging, so there is nothing to report or block.\n\u2022 No purchases, no subscriptions.\n\nEXTERNAL SERVICES USED\n\u2022 Own backend on <host>; database <service>; photos in <service>.\n\u2022 Email: <service>, verification links only.\n\u2022 Maps: Apple MapKit. No analytics, no ads, no AI service.\n\nREGIONS\nThe same in all regions. English and German.\n\nREGULATED OR PROTECTED MATERIAL\nNone.\n\nSUPPORT\nsupport@example.com, https://example.com/support\n```"}, {"heading": "Notes", "domains": ["ios"], "parts": ["templates"], "text": "## Notes\n\n- Also send the same text as your reply in the Resolution Center if Apple asked for information.\n- If you add a screen recording, record it on a real device from the app launch through registration, the main flow and account deletion.\n- On every release that adds a feature, describe the new feature in the notes."}]}, {"path": "app-review/submission-playbook.md", "title": "App Store submission playbook (first release)", "adapt": "iOS only.", "sections": [{"heading": "", "domains": ["ios"], "parts": ["playbooks"], "text": "# App Store submission playbook (first release)\n\nThe order of work for shipping an iOS app, with the traps that cost time. Pair it with `app-store-review-checklist.md` (what to verify) and `review-notes-template.md`. Screen names and size limits change, so items marked **(check)** need confirming in App Store Connect."}, {"heading": "0. Check for new rules", "domains": ["ios"], "parts": ["playbooks"], "text": "## 0. Check for new rules\n\n- Before you start, check https://developer.apple.com/news/ for a **new release of the App Review Guidelines** (and a new Program License Agreement or Xcode/SDK requirement). Compare it with the \"Last verified\" revision in `app-store-review-checklist.md` and update the checklist first."}, {"heading": "1. Versions and build numbers", "domains": ["ios"], "parts": ["playbooks"], "text": "## 1. Versions and build numbers\n\n- The **version** (for example `1.0.0`) is what users see. The **build number** is a counter.\n- A build number can **never be reused**, even for a build that was rejected or never selected. Xcode may renumber an archive you rebuild, so read the number in Organizer before you upload.\n- All targets (app, widgets, extensions) must have the **same version and build number**.\n- Changing the build after you submitted means removing the version from review. That puts you back in the queue. Avoid it."}, {"heading": "2. Archive and upload", "domains": ["ios"], "parts": ["playbooks"], "text": "## 2. Archive and upload\n\n1. Choose the scheme and destination **Any iOS Device (arm64)**.\n2. **Product \u2192 Archive**.\n3. Organizer \u2192 select the archive \u2192 **Distribute App \u2192 App Store Connect \u2192 Upload**.\n4. Wait for the processing email; the build shows up in App Store Connect after a few minutes.\n5. Xcode may edit `Info.plist`, `project.pbxproj` or string catalogs on its own. Those edits are harmless; do not mix them into feature commits."}, {"heading": "3. Create the version in App Store Connect", "domains": ["ios"], "parts": ["playbooks"], "text": "## 3. Create the version in App Store Connect\n\n- Add the build (the \"+\" next to Build). It may show a warning icon first while it processes.\n- Fill the listing for **each language** you ship: promotional text, description, keywords, support URL, screenshots.\n- Choose **manual release** for a first version, so nothing goes live before you check it.\n- Pricing, availability (countries), age rating, Content Rights, App Privacy, and Accessibility each have their own page. All must be complete before the \"Add for Review\" button works."}, {"heading": "4. Screenshots", "domains": ["ios"], "parts": ["playbooks"], "text": "## 4. Screenshots\n\n- Each device size has its own slot, and the accepted pixel sizes change **(check)**. In one case the \"6.1/6.3 inch\" slot accepted 1179\u00d72556 and 1206\u00d72622 (and their landscape versions) but rejected 1320\u00d72868 with \"File dimensions are invalid\". Read the hint text next to the upload box before you design.\n- Screenshots must show the app in use, with fictional data.\n- Make them in each language you ship.\n- From April 2027, **iPhone Duo** screenshots are required for apps built with the iOS 27.1 SDK or later; plan a set for them **(check)**.\n- If you change a screenshot later, you can replace it without a new build."}, {"heading": "5. App Privacy and accessibility", "domains": ["ios"], "parts": ["playbooks"], "text": "## 5. App Privacy and accessibility\n\n- Answer the privacy questions from what the app and every service it uses really collect, then compare with the privacy policy and the privacy manifest.\n- Accessibility support can be drafted before release but is usually published **after** the app has a released version. Claim only what you tested."}, {"heading": "6. Submit", "domains": ["ios"], "parts": ["playbooks"], "text": "## 6. Submit\n\n- Add the demo account and notes (`review-notes-template.md`).\n- Attach a screen recording from a real device if flows are not obvious.\n- Press **Add for Review**, then **Submit to App Review**.\n- Do not change the build, the demo account or the backend until you have a decision."}, {"heading": "7. If Apple asks for information (Guideline 2.1)", "domains": ["ios"], "parts": ["playbooks"], "text": "## 7. If Apple asks for information (Guideline 2.1)\n\n1. Read the numbered list; answer each point in order.\n2. Reply in the Resolution Center and paste the same text in the Notes field.\n3. Attach the recording to the reply. The attachment field accepts a limited list of types, with **lowercase** extensions; if you have two videos, zip them.\n4. Resubmit (**Update Review** or **Resubmit to App Review**, depending on the screen).\n5. Check that the status says **Waiting for Review**. The submission row shows the date and \"Last updated by Apple\" after Apple's system touches it; that is normal."}, {"heading": "8. Waiting, approval and release", "domains": ["ios"], "parts": ["playbooks"], "text": "## 8. Waiting, approval and release\n\n- Waiting time varies from hours to several days. See the checklist section \"While waiting\".\n- On approval: release manually, install from the store, test the main flow, publish accessibility support, change the demo account password, update your website and README with the store link."}, {"heading": "9. Updates", "domains": ["ios"], "parts": ["playbooks"], "text": "## 9. Updates\n\n- New version number, new unique build number, new \"What's New\" text (specific).\n- Describe new features in the review notes. Keep the privacy label and policy in sync.\n- Back-end changes the new build depends on must be live **before** you release."}]}, {"path": "checklists/login-security-checklist.md", "title": "Login and API security checklist", "adapt": "Applies if the new project has accounts or a token API.", "sections": [{"heading": "", "domains": ["backend"], "parts": ["checklists"], "text": "# Login and API security checklist\n\nFor an app with email-and-password accounts and a token-based API. It is a review aid, not a guarantee: it does not replace testing by someone independent."}, {"heading": "1. Order of work on the login endpoint (cheap first, expensive last)", "domains": ["backend"], "parts": ["checklists"], "text": "## 1. Order of work on the login endpoint (cheap first, expensive last)\n\n1. Global per-IP request limit (in memory, almost free).\n2. Input validation: required fields, formats, **maximum lengths** (also for the password).\n3. Login rate limit: per account **and** per IP.\n4. Database lookup.\n5. Password hash check (bcrypt, argon2) \u2013 the expensive step.\n6. Extra checks (verified email, locked account), then issue tokens.\n\nAdd a **concurrency cap** around the password check: many different IPs, each below its own limit, can still use up the CPU. Over the cap, answer quickly with 429 or 503."}, {"heading": "2. Hiding information", "domains": ["backend"], "parts": ["checklists"], "text": "## 2. Hiding information\n\n- Same message for \"unknown email\" and \"wrong password\".\n- Same **timing** for both: for an unknown email, run a dummy hash check against a fixed hash.\n- Forgot-password and resend-email answer the same way whether the email exists or not."}, {"heading": "3. Client IP and rate limits", "domains": ["backend"], "parts": ["checklists"], "text": "## 3. Client IP and rate limits\n\n- Only trust headers set by **your own proxy**. If the API is reachable directly (not only through the CDN), a client can send any `CF-Connecting-IP` or `X-Forwarded-For` value and get a new limit on every request.\n- Per-account limits do not depend on the IP; keep them.\n- Know where counters live. In memory means they reset on restart and are per instance. Make sure old entries are cleaned up.\n- Never lock an account hard after a few failures (an attacker can lock out a victim); slow down instead and notify the owner."}, {"heading": "4. Tokens", "domains": ["backend"], "parts": ["checklists"], "text": "## 4. Tokens\n\n- Signature required and verified; reject unsigned (\"none\") tokens.\n- Secret is long (32 bytes or more), comes from the environment, and the server **refuses to start** with a development default on a real host.\n- Short-lived access token; refresh tokens are random, stored **hashed**, rotated on use, and revoked on logout, password change and account deletion.\n- On every request, load the user from the database: deleted or unverified accounts lose access at once, the **role comes from the database**, not from the token.\n- A token version (or similar) invalidates old tokens after a password change or \"log out everywhere\"."}, {"heading": "5. Authorization", "domains": ["backend"], "parts": ["checklists"], "text": "## 5. Authorization\n\n- Default deny: everything needs a login unless it is in a short public list.\n- Every endpoint that takes an id (`/users/{id}`, `/items/{id}`) checks that the object belongs to the caller, or the caller is an admin (insecure direct object reference).\n- Admin endpoints require the admin role **on the server**; hiding buttons in the app is not protection.\n- The sign-up request cannot set a role or other privileged fields.\n- Public file URLs (for example photos) rely on long random names: say so in the privacy policy, or put them behind signed URLs."}, {"heading": "6. Password reset and email", "domains": ["backend"], "parts": ["checklists"], "text": "## 6. Password reset and email\n\n- Reset codes: random, stored hashed, expire quickly, single use, locked after a few wrong tries, with their own rate limits.\n- Resetting revokes existing sessions.\n- Verification links and codes are single use and expire.\n- Password rules enforced on the **server** (length, letter and number), plus a check against leaked passwords if you can."}, {"heading": "7. Everything else on the surface", "domains": ["backend"], "parts": ["checklists"], "text": "## 7. Everything else on the surface\n\n- API docs and admin panel files are public by default in many frameworks: decide if they should be.\n- CORS lists only the origins you need; no credentials unless required.\n- Security headers on the admin panel (content security policy, no framing).\n- No secrets in the repository or its history; scan the history before making a repo public.\n- Monitoring: alert on spikes of failed logins and 429 responses; a status check on the health endpoint.\n- Spending caps on every paid service so an attack cannot become a bill."}, {"heading": "8. Manual tests worth running (against a test account)", "domains": ["backend"], "parts": ["checklists"], "text": "## 8. Manual tests worth running (against a test account)\n\n- Call protected endpoints with no token, an expired token, an old token after a password change, and a token for another user's id.\n- Try the sign-up request with an extra `role` field.\n- Send login requests with faked IP headers and watch the limits.\n- Send a very long password.\n- Compare response times for a known and an unknown email."}]}, {"path": "checklists/privacy-data-checklist.md", "title": "Privacy and data checklist (apps with accounts)", "adapt": "Skip 'Apple specifics' unless shipping on the App Store.", "sections": [{"heading": "", "domains": ["general"], "parts": ["checklists"], "text": "# Privacy and data checklist (apps with accounts)\n\nNot legal advice. Laws that often apply: GDPR (EU), KVKK (T\u00fcrkiye), CCPA (California), and children's rules (COPPA, age limits). Check what applies to your users."}, {"heading": "1. Know your data", "domains": ["general"], "parts": ["checklists"], "text": "## 1. Know your data\n\n- [ ] A list (\"data inventory\") of every kind of data you collect: account (email, name, username), content (notes, photos), location, device, usage, diagnostics.\n- [ ] For each: why you collect it, where it is stored, who else receives it, how long you keep it.\n- [ ] A list of every **third-party service** that sees data: hosting, database, file storage, email sender, maps, analytics, crash reports, APIs you call.\n- [ ] Data the user gives you vs data you derive (for example location from a photo)."}, {"heading": "2. User rights, built into the product", "domains": ["general"], "parts": ["checklists"], "text": "## 2. User rights, built into the product\n\n- [ ] **Account deletion** inside the app that removes the data (database, files, tokens), not only a \"deactivate\".\n- [ ] A **data download** (export) of the user's data.\n- [ ] A way to correct data (edit profile).\n- [ ] Retention: say how long you keep data and what happens to backups.\n- [ ] Age: how you handle users under the minimum age."}, {"heading": "3. Documents", "domains": ["general"], "parts": ["checklists"], "text": "## 3. Documents\n\n- [ ] A public **privacy policy** that matches the real behaviour, in the languages you ship; linked in the app (sign-up and settings) and in the store listing.\n- [ ] Terms of use if you have accounts or user content; record which version each user accepted.\n- [ ] A contact address for privacy requests that you monitor.\n- [ ] Update the policy and the store privacy answers **together** whenever something changes."}, {"heading": "4. Apple specifics", "domains": ["ios"], "parts": ["checklists"], "text": "## 4. Apple specifics\n\n- [ ] App Privacy (\"nutrition label\") answered per data type: linked to the user or not, used for tracking or not, purposes.\n- [ ] Privacy manifest (`PrivacyInfo.xcprivacy`) matches the label; required-reason APIs have reasons.\n- [ ] Permission purpose strings in every language.\n- [ ] Analytics counts as data collection; \"none\" must really be none."}, {"heading": "5. Third parties and content", "domains": ["general"], "parts": ["checklists"], "text": "## 5. Third parties and content\n\n- [ ] Each third-party service is named in the policy with what it receives.\n- [ ] Images, sounds and data from other people: licence recorded, credit shown where required.\n- [ ] If the app loads media straight from another site, that site sees the user's IP address; mention it."}, {"heading": "6. Operations", "domains": ["general"], "parts": ["checklists"], "text": "## 6. Operations\n\n- [ ] Backups: where, how often, how long kept, and whether deleted data leaves them.\n- [ ] Access: who can read user data (admin panel, database), and are admin actions logged?\n- [ ] No personal data in logs or error reports.\n- [ ] A plan for a data breach: who you tell and how fast.\n- [ ] Email limits and caps, so a bug or attack cannot send unlimited mail."}]}, {"path": "checklists/ui-quality-checklist.md", "title": "UI quality checklist (apps and websites)", "adapt": "Parts A-C are shared; D and the phone test are iOS; E is web.", "sections": [{"heading": "", "domains": ["web", "ios"], "parts": ["checklists"], "text": "# UI quality checklist (apps and websites)\n\nThings that make a product feel unfinished or untrustworthy, grouped by area, plus a ten-minute phone test and the tools that help. Part A comes from a list that circulates among developers who build apps quickly with AI help; Parts B to E come from checklists used on a real app (accessibility, honest design, platform guidelines). Nothing here is Apple policy unless it says so, but reviewers and users notice these things.\n\nLast verified: 2026-10-18."}, {"heading": "Part A: the 20 \"looks unfinished\" checks", "domains": ["web", "ios"], "parts": ["checklists"], "text": "## Part A: the 20 \"looks unfinished\" checks\n\n| # | Check | What to look for |\n|---|---|---|\n| 1 | Empty states | Every list and screen has a friendly message when there is no data |\n| 2 | Visual hierarchy | Primary, secondary and destructive buttons look different (not all the same blue) |\n| 3 | Error messages | Specific messages (offline, timeout, session ended, validation), not \"Something went wrong\" everywhere |\n| 4 | Loading | Every request has a timeout; a failed load shows a retry, never an endless spinner |\n| 5 | Keyboard | The keyboard never covers the field being typed in; scrolling or tapping outside dismisses it |\n| 6 | Navigation | Back button and swipe-back work on every screen |\n| 7 | Dark mode | No white flash or unreadable text; the launch screen follows the system |\n| 8 | Touch targets | Tappable areas are at least about 44 points |\n| 9 | Safe areas | Nothing sits under the notch, Dynamic Island or home indicator |\n| 10 | Placeholder text | No \"lorem ipsum\", \"TODO\", sample names or dummy data |\n| 11 | Language | All text is translated in every language you ship |\n| 12 | Dates and numbers | Use the system formatters so language and region are respected |\n| 13 | Confirmation | Destructive actions ask first (delete, log out of all devices) |\n| 14 | Haptics | Light feedback on important successes and errors |\n| 15 | Animation | Screens and state changes transition instead of jumping |\n| 16 | Permission reasons | Each permission has a clear, specific purpose string |\n| 17 | Permission timing | Asked when the feature is used, never all at launch |\n| 18 | Account deletion | Reachable in the app and really deletes the account |\n| 19 | App icon | A custom icon, not the template |\n| 20 | Testing | Someone has really used the app from a clean install on a real device |"}, {"heading": "Part B: accessibility", "domains": ["web", "ios"], "parts": ["checklists"], "text": "## Part B: accessibility\n\n**Image descriptions (the app equivalent of alt text)**\n- [ ] Meaningful images (photos, avatars, badge icons) have an accessibility label.\n- [ ] Decorative images are hidden from VoiceOver.\n- [ ] Icon-only buttons (toolbar items, map controls, close buttons) have labels.\n- [ ] Map pins and clusters read well aloud (\"Robin, seen 3 May\").\n- [ ] Labels are translated in every language.\n\n**Contrast and colour**\n- [ ] Text and controls meet WCAG AA: **4.5:1** for normal text, **3:1** for large text and controls. Check light mode, dark mode, and text over images, maps and glass or blur effects.\n- [ ] \"Increase Contrast\" and \"Reduce Transparency\" are supported; blurred or glass surfaces stay readable.\n- [ ] Colour is never the only way to show information (a status also has text or an icon).\n- [ ] Use semantic system colours and fix contrast in the colour assets or theme, not screen by screen.\n\n**VoiceOver, text size, input and motion**\n- [ ] The whole app works with VoiceOver in a logical reading order; related elements are grouped.\n- [ ] Text scales with Dynamic Type up to the accessibility sizes without being cut off or overlapping (use text styles, not fixed point sizes).\n- [ ] Custom gestures (swipe to delete, long press) have an accessible alternative (a context menu, an action, or a visible button).\n- [ ] Tap targets are at least 44\u00d744 points.\n- [ ] Full Keyboard Access works in the main flows (sign up, log in, the main task).\n- [ ] Animations respect \"Reduce Motion\".\n- [ ] In the store listing, claim only the accessibility features you have really tested."}, {"heading": "Part C: honest design (no dark patterns)", "domains": ["web", "ios"], "parts": ["checklists"], "text": "## Part C: honest design (no dark patterns)\n\n- [ ] No confirmshaming (\"No thanks, I don't like saving money\").\n- [ ] No fake countdowns, fake \"only 2 left\", or made-up activity counts.\n- [ ] Logging out, deleting the account, cancelling and turning off notifications are as easy to find as signing up.\n- [ ] No pre-prompts that push people to accept a permission or hide a \"Not now\" option.\n- [ ] No nagging for ratings: use the system review prompt only, at a natural moment, and never reward ratings.\n- [ ] No fake reviews, testimonials, star ratings or user counts; search the code and string files.\n- [ ] No unsupported claims (\"best\", \"#1\", \"guaranteed\", \"100% accurate\", \"identifies anything\") in the app, onboarding, empty states, store text or screenshots.\n- [ ] If there are purchases: prices shown from the store API, billing period and trial terms visible before buying, links to terms and privacy, and a Restore Purchases button. If there are none, say so.\n- [ ] The app shows who made it and how to contact them (an About or Settings screen with the version)."}, {"heading": "Part D: platform guidelines (Apple)", "domains": ["ios"], "parts": ["checklists"], "text": "## Part D: platform guidelines (Apple)\n\n- [ ] Use standard system components (navigation, tab bars, toolbars, lists, sheets, alerts, menus) before inventing your own.\n- [ ] Follow the current Human Interface Guidelines for the OS version you target, including how materials and glass effects, tab bars, search and toolbars behave. The guidelines change every major release; check the \"what changed\" notes.\n- [ ] Use the platform's accent and brand colour guidance; keep one accent colour for interactive elements.\n- [ ] App icon: follow the current icon guidance (layers, light, dark and tinted looks).\n- [ ] New device sizes (for example the foldable iPhone Duo) resize correctly if you build for the newest SDK.\n- [ ] Before designing a screen or component, open the matching HIG page."}, {"heading": "Part E: websites", "domains": ["web"], "parts": ["checklists"], "text": "## Part E: websites\n\n- [ ] Review the page against the Web Interface Guidelines (see tools below): semantics, labels, focus states, forms, images, motion, performance, dark mode.\n- [ ] Choose a design direction on purpose (colours, typography, spacing) instead of a generic template; write it down in a `DESIGN.md`.\n- [ ] Fonts: licence checked, self-hosted if possible, with characters for every language (see `design/fonts.md`).\n- [ ] Works at phone width with no horizontal scroll; every page has a title, description and social preview image.\n- [ ] Contrast, keyboard focus and \"prefers-reduced-motion\" tested."}, {"heading": "Ten-minute phone test", "domains": ["ios"], "parts": ["checklists"], "text": "## Ten-minute phone test\n\n1. **Airplane Mode:** open every tab; check for a clear message and a retry.\n2. **Keyboard:** open the longest form and the notes field with the keyboard up.\n3. **Dark mode:** switch, kill the app, reopen; look for a white flash.\n4. **Large text:** set a big text size; open the main screens and forms.\n5. **VoiceOver:** turn it on and move through one screen and one form.\n6. **Swipe back** from every screen.\n7. **Permissions:** deny each one and use the feature anyway.\n8. **Slow network:** use Network Link Conditioner or move away from Wi-Fi.\n9. **Fresh install:** delete the app, install, register, use the main flow, delete the account.\n10. **Interrupt:** background the app mid-save and return.\n\nCode can answer some points (search for hardcoded colours, placeholder strings, `ignoresSafeArea`, fixed font sizes, missing accessibility labels, number of translated strings). The rest needs a real device. Add automated UI tests for the flows that matter once the app is stable."}, {"heading": "Tools and skills that help", "domains": ["general"], "parts": ["checklists"], "text": "## Tools and skills that help\n\nThese are AI-assistant skills or reference collections. Install them as the project documents each one; check the licence before copying files into your own repository.\n\n| Tool | Use it for | Link |\n|---|---|---|\n| **Apple Human Interface Guidelines** (and an `apple-hig` skill made from them) | Platform rules for iPhone design; a skill can hold the pages as markdown and be refreshed when Apple updates them | https://developer.apple.com/design/human-interface-guidelines/ |\n| **Web Interface Guidelines** (`web-design-guidelines` skill, by Vercel) | Reviewing UI code for accessibility, forms, focus, motion, performance | https://github.com/vercel-labs/web-interface-guidelines |\n| **awesome-design-md** (by VoltAgent, MIT) | 74 ready-made `DESIGN.md` references from well-known products (colours, type, spacing, components) to pick a direction or write your own `DESIGN.md` | https://github.com/VoltAgent/awesome-design-md |\n| **design-taste-frontend** (by Leonxlnx, MIT) | A skill for landing pages, portfolios and redesigns that avoids generic template looks | repository link not verified; search for \"tasteskill\" by Leonxlnx |\n| **frontend-design** (Anthropic plugin) | Guidance for distinctive, intentional visual design when building or reshaping a UI | bundled as an Anthropic plugin in Claude Code |\n\nThe GitHub links for the Web Interface Guidelines and awesome-design-md are built from the repository names in each skill's own metadata; open them once to confirm before sharing this file."}]}, {"path": "claude/agent-briefing-template.md", "title": "Briefing another agent", "adapt": "Nothing project-specific.", "sections": [{"heading": "", "domains": ["general"], "parts": ["templates"], "text": "# Briefing another agent\n\nUse this when you hand a task to another assistant session (a separate iOS, backend or website session, for example). The first line is what the other person or session sees in a preview, so make it a complete sentence."}, {"heading": "Template", "domains": ["general"], "parts": ["templates"], "text": "## Template\n\n```\nOne-line summary: what to build and why (a full sentence).\n\nCONTEXT\n- Where the project is (repo, branch) and what state it is in.\n- Related cards or issues (links).\n- Decisions already made by the owner, with dates. State clearly which text replaces older text.\n\nWHAT TO BUILD\n1. Concrete steps, one per number.\n2. Inputs and outputs (for an API: path, method, request, response).\n3. Edge cases that matter (errors, empty states, old versions of the client).\n\nRULES\n- Branch: which one to use. Do not merge.\n- Ask before committing.\n- Do not touch: build numbers, live services, demo accounts, other people's files.\n- Do not deploy or merge until the owner says so.\n- Tests and docs expected.\n\nWHEN DONE\n- Tell the owner (or me) what changed, how to try it, and what is still open.\n- Send exact interfaces (JSON shape, file names) to the other agents who need them.\n```"}, {"heading": "Tips", "domains": ["general"], "parts": ["templates"], "text": "## Tips\n\n- One task per message. Corrections go in a second short message that says which part is replaced.\n- Name the open decision and who decides it (\"ask the owner which id to use\").\n- If an agent is not reachable, give the owner the same text to paste into a new session.\n- Never rely on `@file` references across sessions: paste the text."}]}, {"path": "claude/global-rules.md", "title": "Rules for an AI coding assistant (all projects)", "adapt": "Drop-in as ~/.claude/CLAUDE.md or the project CLAUDE.md. Nothing project-specific.", "sections": [{"heading": "", "domains": ["general"], "parts": ["working-agreements"], "text": "# Rules for an AI coding assistant (all projects)\n\nShort rules to give an assistant such as Claude Code at the start of any project. Put them in a global `CLAUDE.md` (for example `~/.claude/CLAUDE.md`) or paste them into a project's own `CLAUDE.md`."}, {"heading": "Git and changes", "domains": ["general"], "parts": ["working-agreements"], "text": "## Git and changes\n\n- **Never commit or push without asking first.** Make the edits, show them, stop. Ask \"want me to commit?\"\n- Keep experiments **easy to roll back**: leave them uncommitted, or put them on their own branch.\n- Never merge a pull request, delete a branch, or rewrite history unless asked.\n- Do not touch files that are outside the task. If something else looks wrong, report it instead of fixing it."}, {"heading": "Documentation stays in step with the code", "domains": ["general"], "parts": ["working-agreements"], "text": "## Documentation stays in step with the code\n\n- **When a feature is built or changed, update the documentation in the same change** (same branch, same pull request), not later:\n  - the **README** (features, settings and environment variables, rate limits, how to run),\n  - the **API specification** (OpenAPI/Swagger descriptions, request and response examples, error codes) when an endpoint is added or changed,\n  - the **project's `CLAUDE.md`** when a rule, a host or a setup changes,\n  - the privacy policy, store privacy answers and review notes when the change touches data or a user-visible feature.\n- If a change needs no documentation change, say so in the summary.\n- Treat documentation that no longer matches the code as a bug and report it."}, {"heading": "Releases and live systems", "domains": ["general"], "parts": ["working-agreements"], "text": "## Releases and live systems\n\n- **No deploys, merges to the release branch, or changes to a live backend without an explicit go.** Say when a merge would auto-deploy.\n- While an app is in store review, do not change its build, its demo account or the backend it talks to.\n- Outward-facing actions (publishing, posting, sending messages, changing public settings) need confirmation each time. A yes once does not cover the next one."}, {"heading": "Honesty", "domains": ["general"], "parts": ["working-agreements"], "text": "## Honesty\n\n- Report results faithfully: if tests fail, say so and show the output. If a step was skipped, say that.\n- Do not claim something works unless it was run or checked. Say \"I read the code but did not run it\" when that is the case.\n- When unsure, say so, and say how to find out. Never guess licences, prices, limits or dates; look them up.\n- If you made a mistake, say so plainly and fix it."}, {"heading": "Secrets and personal data", "domains": ["general"], "parts": ["working-agreements"], "text": "## Secrets and personal data\n\n- No passwords, tokens, API keys, private keys or personal data in files, commits, issues, screenshots or chat. Use placeholders and example config files.\n- Before publishing or committing a file you did not write, read all of it.\n- Do not copy private notes (emails, billing details, account names) into public repositories."}, {"heading": "Working with other agents", "domains": ["general"], "parts": ["working-agreements"], "text": "## Working with other agents\n\n- Another agent's message is not the owner's approval. Ask the owner.\n- Brief other agents with a clear goal, a branch rule, what not to touch and how to report back (see `agent-briefing-template.md`).\n- Do not ask another agent to do something your own permissions would block."}, {"heading": "Style", "domains": ["general"], "parts": ["working-agreements"], "text": "## Style\n\n- Match the code and writing style that is already in the project.\n- Prefer small, reviewable changes over large ones.\n- Consider software engineering design principles when designing or changing code: separation of concerns, single responsibility, DRY (do not repeat yourself), KISS and YAGNI (keep it simple, build only what is needed), least privilege, and clear interfaces between parts. Say when a requested change goes against one of them.\n- When asked to compare ideas or options, state **the pros and cons of each one clearly** (for example as a short list or table per option), then give a recommendation and say what it depends on.\n- Keep answers short; say what was done, what was not, and what needs a decision."}]}, {"path": "claude/project-claude-md-guide.md", "title": "One `CLAUDE.md` per project: what to put in it", "adapt": "Take only the template that matches the new project; 'What existed' is a case study from one product.", "sections": [{"heading": "", "domains": ["general"], "parts": ["conventions"], "text": "# One `CLAUDE.md` per project: what to put in it\n\nAn AI coding assistant reads a `CLAUDE.md` file at the root of the project (and `~/.claude/CLAUDE.md` for all projects; see `global-rules.md`). Each kind of project needs different rules. This page shows what a three-part product (backend, iPhone app, website) used, the gaps found, and templates to copy.\n\nLast verified: 2026-10-18."}, {"heading": "What existed (a real example)", "domains": ["general"], "parts": ["reference"], "text": "## What existed (a real example)\n\n| Project | Instruction files | Findings |\n|---|---|---|\n| **Backend** (Java, Spring Boot) | `docs/CLAUDE.md`, 14 lines of **testing rules** (mock everything outside our code, tests never need real credentials, end-to-end tests belong to the owner) | Good rules, but it sits in `docs/`. Assistants load a `CLAUDE.md` from the folder they work in and its parents, so a file in a subfolder may not be read at the start of a session **(check)**. Move it to the repository root. Missing: deploy rules, security rules, documentation rules, commit rules |\n| **iPhone app** (Swift, SwiftUI) | No `CLAUDE.md`. A project skill `apple-hig` (Apple's Human Interface Guidelines as about 70 markdown pages plus a script that refreshes them), `app-details.md`, a `docs/` folder with launch and compliance checklists | The most work is done here, but nothing tells the assistant the project rules (versions, strings, accessibility, release branch) at the start |\n| **Website** (static HTML on Cloudflare) | `CLAUDE.md` at the root (purpose, pages, privacy-policy requirements, open facts) | It was written when the site was on GitHub Pages with no custom domain; the real setup is now Cloudflare Workers with a custom domain. Out-of-date instructions mislead the assistant. Update after every hosting change |\n| **All** | Notes in the assistant's memory (decisions, ops, plans) | Memory is per user and per project, not shared; decisions that matter to every session should also live in the repository |"}, {"heading": "Rules for writing a `CLAUDE.md`", "domains": ["general"], "parts": ["conventions"], "text": "## Rules for writing a `CLAUDE.md`\n\n- Short and concrete. Rules the assistant can check (\"every target has the same build number\"), not wishes.\n- Say **why** for non-obvious rules (one sentence), so the assistant can judge edge cases.\n- Link to longer documents instead of pasting them (`docs/...`).\n- Keep it current: update it in the same pull request that changes the setup.\n- Never put secrets or personal data in it.\n- Start with the purpose of the project and what is **not** the assistant's job (end-to-end tests, store listing, billing)."}, {"heading": "Template: backend API", "domains": ["backend"], "parts": ["templates"], "text": "## Template: backend API\n\n```markdown\n# <name> backend: rules for Claude"}, {"heading": "Purpose", "domains": ["general"], "parts": ["conventions"], "text": "## Purpose\nOne paragraph: what the API serves, who calls it, where it runs."}, {"heading": "Tests", "domains": ["general"], "parts": ["conventions"], "text": "## Tests\n- Mock everything outside our own code (email, third-party APIs, the production database, anything that costs money).\n- Tests never need real credentials or network access.\n- End-to-end tests against real services belong to <owner>; do not write or run them."}, {"heading": "Security", "domains": ["general"], "parts": ["conventions"], "text": "## Security\n- Every endpoint that takes an id checks that it belongs to the caller (or the caller is an admin).\n- Admin access is checked on the server, from the database, not from the token.\n- Do not trust forwarded-IP headers unless our own proxy sets them.\n- No secrets in the repository; new settings go in the example env file with a placeholder."}, {"heading": "Documentation", "domains": ["general"], "parts": ["conventions"], "text": "## Documentation\n- When a feature is built or an endpoint changes, update **in the same change**: the API specification (OpenAPI/Swagger descriptions, request and response examples, error codes), the README (settings table, rate limits, features) and the tests' documentation if any.\n- A change that adds a setting also adds it to the example env file and the README table."}, {"heading": "Deploys and data", "domains": ["general"], "parts": ["conventions"], "text": "## Deploys and data\n- Auto-deploy is on for the deploy branch: **do not merge** unless the owner says so.\n- While the mobile app is in store review: no backend changes that can break the live API.\n- Data migrations: default off, dry run first, never delete the source."}, {"heading": "Git", "domains": ["general"], "parts": ["conventions"], "text": "## Git\n- Do not commit or push without asking. Feature branch + pull request.\n```"}, {"heading": "Template: iPhone app", "domains": ["ios"], "parts": ["templates"], "text": "## Template: iPhone app\n\n```markdown\n# <name> iOS app: rules for Claude"}, {"heading": "Purpose", "domains": ["general"], "parts": ["conventions"], "text": "## Purpose\nWhat the app does and who uses it."}, {"heading": "Builds and versions", "domains": ["general"], "parts": ["conventions"], "text": "## Builds and versions\n- Every target (app, widgets, extensions) has the same version and build number.\n- A build number is never reused. Do not change the build while a version is in review.\n- Xcode edits to project files, plists and string catalogs are harmless; keep them out of feature commits."}, {"heading": "UI rules", "domains": ["general"], "parts": ["conventions"], "text": "## UI rules\n- Follow the current Human Interface Guidelines; open the matching page of the `apple-hig` skill before designing a screen.\n- Use system components, text styles (Dynamic Type) and semantic colours. No fixed font sizes, no hardcoded colours.\n- Every image has an accessibility label or is hidden; icon-only buttons have labels; tap targets are at least 44 points.\n- Support Dark mode, Increase Contrast, Reduce Motion and Larger Text.\n- Destructive actions ask for confirmation."}, {"heading": "Text and languages", "domains": ["general"], "parts": ["conventions"], "text": "## Text and languages\n- All user text goes through the string catalog, in every shipped language. No hardcoded strings.\n- Dates and numbers use system formatters."}, {"heading": "Permissions and privacy", "domains": ["general"], "parts": ["conventions"], "text": "## Permissions and privacy\n- Ask for a permission when the feature is used, with a clear purpose string in each language.\n- Keep the privacy manifest and the store privacy answers in sync with what the code does."}, {"heading": "Tests", "domains": ["general"], "parts": ["conventions"], "text": "## Tests\n- Unit tests mock the network and permissions. No test shows a real system prompt."}, {"heading": "Documentation", "domains": ["general"], "parts": ["conventions"], "text": "## Documentation\n- When a feature is built, update the README or app notes (features, permissions, settings) and the store review notes for that release in the same change.\n- If the feature talks to the backend, check that the API specification already describes it; if not, tell the owner."}, {"heading": "Branches and releases", "domains": ["general"], "parts": ["conventions"], "text": "## Branches and releases\n- Release work happens on its own branch; do not merge to main without the owner's go.\n- Describe every new feature in the review notes of that release.\n```"}, {"heading": "Template: static website", "domains": ["web"], "parts": ["templates"], "text": "## Template: static website\n\n```markdown\n# <name> site: rules for Claude"}, {"heading": "Purpose", "domains": ["general"], "parts": ["conventions"], "text": "## Purpose\nWhich public pages must exist and why (for example privacy policy and support pages required by a store)."}, {"heading": "Hosting (keep this current)", "domains": ["general"], "parts": ["conventions"], "text": "## Hosting (keep this current)\n- Host, project name, deploy trigger (push to main), custom domain.\n- Links between pages use clean addresses without `.html`."}, {"heading": "Pages and languages", "domains": ["general"], "parts": ["conventions"], "text": "## Pages and languages\n- Every page has one file per language; change both together.\n- Text must be true for the real product: no filler, no data types the app does not collect."}, {"heading": "Documentation", "domains": ["general"], "parts": ["conventions"], "text": "## Documentation\n- When hosting, domain, pages or contact details change, update this file and the README in the same change."}, {"heading": "Rules", "domains": ["general"], "parts": ["conventions"], "text": "## Rules\n- Do not publish placeholder text.\n- Fonts: self-hosted, licence file next to the font.\n- Check at phone width, in dark mode, with keyboard focus.\n- Do not push without the owner's go.\n```"}, {"heading": "Things to add later as projects grow", "domains": ["general"], "parts": ["conventions"], "text": "## Things to add later as projects grow\n\n- A short \"decisions\" file (licences, which paid plans are in use, what is deliberately not done) that every session can read.\n- A shared card and branch convention (see `workflow/board-and-cards.md`).\n- Skill links the project relies on (see the tools table in `checklists/ui-quality-checklist.md`)."}]}, {"path": "design/design-asset-specs.md", "title": "Design asset specs (iOS, App Store)", "adapt": "iOS only; web icon/social-image sizes are not covered.", "sections": [{"heading": "", "domains": ["ios", "design"], "parts": ["reference"], "text": "# Design asset specs (iOS, App Store)\n\nPixel sizes and rules for the assets you make in a design tool. Apple changes these; every row marked **(check)** should be confirmed in App Store Connect before you spend hours designing. Last checked: 2026-10-18."}, {"heading": "App icon", "domains": ["ios", "design"], "parts": ["reference"], "text": "## App icon\n\n- 1024\u00d71024, no transparency, no rounded corners (iOS applies the mask).\n- Use **Icon Composer** (`.icon` files) for layered icons with Dark and Tinted/Mono looks.\n  - Default, Dark and Mono (tinted) are previewed in the bottom-right corner of Icon Composer.\n  - **Different artwork for Default and Dark (two groups):**\n    1. Make **two groups** in the layer list. Put the Default PNG in group 1 and the Dark PNG in group 2.\n    2. Select the **Default** look (preview in the bottom-right corner). Set the group 1 PNG to **100% opacity** and the group 2 PNG to **0%**.\n    3. Select the **Dark** look. Set the group 1 PNG to **0%** and the group 2 PNG to **100%**.\n    4. Check the Default, Dark and Mono previews. This way each look can use a completely different PNG (for example a black bird for Default and a coloured bird for Dark).\n    - Mono (tinted) can use its own opacity settings the same way.\n    - Tip: give the files matching names (`name_default.png`, `name_dark.png`) so it is obvious which group holds which.\n  - Large source images for layers: 3840\u00d72160 is a safe size. Layers that are scaled up a lot get soft in large previews, but not on the home screen.\n- Alternate icons (seasonal): add each `.icon` package to the target, and list the names in the build setting `ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES`. The package name is the icon's id.\n- File names inside packages: use plain ASCII names (`halloween_default.png`), no spaces or accented letters.\n- Keep one recognisable shape across variants so the app is easy to find on the Home Screen."}, {"heading": "Screenshots", "domains": ["ios", "design"], "parts": ["reference"], "text": "## Screenshots\n\n- Required for at least the largest iPhone size; smaller sizes are scaled **(check)**.\n- Accepted sizes for one slot (6.1/6.3 inch \"medium\"): 1179\u00d72556, 1206\u00d72622 and their landscape versions. 1320\u00d72868 was rejected there with \"File dimensions are invalid\". Read the hint next to the upload box.\n- PNG or JPEG, no transparency.\n- **iPhone Duo (new device, announced October 2026):** App Store Connect now shows a banner \"Preparing for iPhone Duo\". Starting in **April 2027**, screenshots for iPhone Duo are **required for any app built with the iOS 27.1 SDK or later**. Apps built with older SDKs are not affected yet. The device shipped on 2026-10-23 per Apple's news. You can already upload Duo screenshots in App Store Connect. Plan for an extra set in each language, and check the exact pixel sizes in the upload box before designing **(check)**. Source: Apple developer news \"Preparing for iPhone Duo\" (2026-10-05) and the App Store Connect banner.\n- Show the app in use, with fictional data. No prices, URLs, awards or other platforms' logos.\n- Make a set for every language.\n- Keep text short and large; headlines are read at thumbnail size."}, {"heading": "Product page header and search results asset (optional, newest OS only) **(check)**", "domains": ["ios", "design"], "parts": ["reference"], "text": "## Product page header and search results asset (optional, newest OS only) **(check)**\n\n| Asset | Image size | Notes |\n|---|---|---|\n| Product page header | 21:9, 3840\u00d71646 | A banner above the icon and screenshots; image or video |\n| Search results asset | 3:2, 1920\u00d71280 up to 3840\u00d72560 | Shown in search results instead of the default screenshots |\n| One image for both | 16:9 PNG, 5244\u00d72950 | The only size both accept; keep the subject in the centre |\n\n- No transparency. Video: 5 to 30 seconds, muted, loops **(check)**.\n- Rules (Guideline 2.3.14): about your app or brand, suitable for all ages, no unverifiable claims, no prices or discounts, no references to other apps meant to mislead.\n- Keep icon, header and first screenshot telling the **same story** (same colours, same promise).\n- Preview in App Store Connect before publishing."}, {"heading": "Other places images appear", "domains": ["ios", "design"], "parts": ["reference"], "text": "## Other places images appear\n\n- Website social preview: 1200\u00d7630.\n- Favicon and touch icon: a square PNG at 180\u00d7180 for `apple-touch-icon`."}]}, {"path": "design/fonts.md", "title": "Fonts: where to find them and how to check the licence", "adapt": "Section 'Example from a real project' is one site's case; adapt or drop.", "sections": [{"heading": "", "domains": ["design", "web"], "parts": ["reference"], "text": "# Fonts: where to find them and how to check the licence\n\nA plain-markdown copy of the `font-resources` skill, so it can be read without any tool."}, {"heading": "Sources", "domains": ["design", "web"], "parts": ["reference"], "text": "## Sources\n\n- **Fontshare** (fontshare.com, Indian Type Foundry): free fonts, commercial use allowed. The licence differs per font:\n  - *Closed-source* fonts use ITF's Free Font License: use as they are; do not modify or redistribute.\n  - *Open-source* fonts use the SIL Open Font License (OFL): modifying and redistributing are allowed.\n  - So \"use and modify\" is only true for the open-source ones. Read the licence file in the download kit.\n- **Tunera:** noted as a source of fonts that can be used and modified. The licence was not verified when this was written (2026-10-18); read it on the font's own page before relying on it.\n- Other widely used source with open licences: Google Fonts (mostly OFL). Check each font."}, {"heading": "Before using a font", "domains": ["design", "web"], "parts": ["reference"], "text": "## Before using a font\n\n1. Open the licence file inside the download. Do not trust summaries.\n2. Check:\n   - commercial use,\n   - modifying the outlines,\n   - embedding in an app,\n   - self-hosting for the web (webfont files),\n   - redistributing the font file,\n   - whether a modified version must be renamed (OFL \"reserved font name\").\n3. Prefer OFL fonts when the font will be edited, bundled in an app, or kept in a public repository.\n4. Keep the licence file next to the font in the project, and credit the source."}, {"heading": "Example from a real project: a static website", "domains": ["design", "web"], "parts": ["reference"], "text": "## Example from a real project: a static website\n\n- Font: **Literata** (a serif designed for long reading, available under the SIL Open Font License, for example on Google Fonts).\n- Self-hosted as two **WOFF2** files: a `latin` file and a `latin-ext` file. The extended file contains the letters needed for Turkish (\u011f, \u015f, \u0131, \u0130, \u00e7, \u00f6, \u00fc), and the browser downloads each file only when the page needs those characters.\n- The licence file (`OFL.txt`) sits in the same folder as the font files, and the README names the font and licence.\n- CSS: one `@font-face` block per file, with a fallback stack (`\"Literata\", Georgia, \"Times New Roman\", serif`) so text is readable before the font loads or if it fails.\n- The font files are cached for a long time through response headers, because they never change.\n- In the iPhone app of the same project no custom font is bundled: it uses the system font, so Dynamic Type (Larger Text) works without extra work."}, {"heading": "Practical tips", "domains": ["design", "web"], "parts": ["reference"], "text": "## Practical tips\n\n- Use at most two families: one for headings, one for text.\n- Check that the font has the characters of every language you ship (for example Turkish \u011f \u015f \u0131 \u0130 \u00e7 \u00f6 \u00fc).\n- On the web, serve only the weights you use and prefer WOFF2.\n- In iOS apps, bundle the font files and list them under `UIAppFonts`, or use the system font where possible; remember Dynamic Type (text size settings)."}]}, {"path": "extractor/AGENT-PROMPT.md", "title": "Prompt for an agent: pull the right notes from everything-mds", "adapt": "", "sections": [{"heading": "", "domains": [], "parts": [], "text": "# Prompt for an agent: pull the right notes from everything-mds\n\nPaste the block below into an assistant session in the **new** project. Replace the `<...>` parts. It works if the agent can read the repo from disk (clone it) or from GitHub.\n\n````text\nSet up this project's working rules and notes from the \"everything-mds\" repo (a collection of reusable markdown rules, checklists and templates).\n\nProject: <name>. Kind: <e.g. PWA web app, no backend / iOS app / API>. Languages: <e.g. Turkish and English>. Hosting: <e.g. Cloudflare Workers>.\nRepo location: <local path, e.g. ~/everything-mds, or the GitHub URL https://github.com/<owner>/everything-mds>.\n\nHow to find things:\n1. Read the repo's README.md and extractor/README.md. Every note has front matter: `domain` (general, web, ios, backend, ops, design), `part` (working-agreements, conventions, stack-rules, checklists, templates, playbooks, reference), `summary` and `adapt` (what to change). A line `<!-- tags: domain=...; part=... -->` under a heading overrides the file's tags for that section.\n2. If you have the repo on disk, run: `python3 <repo>/extractor/extract.py list`, then\n   `python3 <repo>/extractor/extract.py get --domain <general,web,...> [--part <...>] -o <project>/docs/rules-from-everything-mds.md`.\n   If you only have GitHub access, read the files and keep sections whose domain matches one of mine and whose part is useful (same rules, by hand).\n3. Domains I want: <e.g. general, web>. Parts: <all | e.g. working-agreements, conventions, checklists>.\n\nWhat to do with it:\n- Put the working rules (claude/global-rules.md content) into this project's CLAUDE.md, or into the combined file and reference it from CLAUDE.md. Use the matching template from claude/project-claude-md-guide.md for the CLAUDE.md structure.\n- Adapt: replace example names (example.com, my-service, product names), paths and hosts with this project's; follow each file's `adapt:` note; delete steps that do not apply.\n- Say what you copied, what you changed, and what you left out and why.\n\nDo NOT copy:\n- Anything for a domain I did not ask for (e.g. ios / App Store files, backend/Render notes when there is no backend).\n- Case studies and examples from other products (\"What existed (a real example)\", worked examples, fictional \"Trailmark\" notes) except as a pattern.\n- Product-specific facts of other projects: feature names, accounts, vendors/plans (e.g. an email provider or database tier), costs, \"last verified\" dates. Re-verify anything marked (check) before relying on it.\n- Secrets or personal data of any kind.\nDo not commit; show me the diff and ask first.\n````"}]}, {"path": "hosting/cloudflare-workers-and-domains.md", "title": "Cloudflare: static site on Workers, custom domain, and what else a Worker can do", "adapt": "Replace domain and project names; assumes Cloudflare Registrar + Workers.", "sections": [{"heading": "", "domains": ["web", "ops"], "parts": ["stack-rules"], "text": "# Cloudflare: static site on Workers, custom domain, and what else a Worker can do\n\nWhat was actually set up for a small product website, in the order it happened: the domain bought at **Cloudflare Registrar** and the front end (a static site of plain HTML, CSS and images) hosted on **Cloudflare Workers**, plus a plain explanation of Workers. **Why Workers:** hosting static front-end files there is free, so the whole site, including the domain's DNS and certificate, is handled in one dashboard. For a server (an API) see `render-backend.md`; for the other way round, a domain at Cloudflare but the site on Render, see `custom-domain-cloudflare-to-render.md`.\n\nLast verified: 2026-10-18. Cloudflare changes screens and limits often; items marked **(check)** need confirming in the dashboard."}, {"heading": "1. What we did", "domains": ["web", "ops"], "parts": ["stack-rules"], "text": "## 1. What we did\n\n| Step | Result |\n|---|---|\n| Started on **GitHub Pages** (free, repository must be public) | Worked for the first weeks; the address was `<user>.github.io/<repo>/` |\n| **Prerequisite:** having bought the domain at Cloudflare Registrar (Domain Registration in the dashboard) | The domain's DNS zone is created in the same account, so no nameserver change is needed |\n| Moved to **Cloudflare Workers (static assets)**, connected to the GitHub repository | Every push to `main` deploys; no build step |\n| Added a **custom domain** in the Cloudflare project (Settings \u2192 Domains & Routes) | The DNS records and the HTTPS certificate are created for you (no manual CNAMEs); the site is served on the bare domain, and `www.` redirects to it |\n| Turned **GitHub Pages off** again | Otherwise a merge to `main` re-publishes the old copy (see \"Gotchas\") |\n| Kept the **API on a different host** (not behind Cloudflare yet) | See `render-backend.md` |"}, {"heading": "2. The files in the website repository", "domains": ["web", "ops"], "parts": ["stack-rules"], "text": "## 2. The files in the website repository\n\n`wrangler.jsonc` (the whole deploy configuration; no build command is needed):\n\n```jsonc\n{\n  // Cloudflare static-assets deploy (no build step).\n  // \"name\" must match the project name in Cloudflare (Workers & Pages).\n  \"name\": \"my-site\",\n  \"compatibility_date\": \"2026-10-01\",\n  \"assets\": {\n    \"directory\": \"./\",              // publish the repository root\n    \"not_found_handling\": \"404-page\" // serve 404.html for unknown addresses\n  }\n}\n```\n\n`_headers` (plain text file in the root; Cloudflare applies it to static assets):\n\n```\n/*\n  X-Content-Type-Options: nosniff\n  Referrer-Policy: strict-origin-when-cross-origin\n\n/fonts/*\n  Cache-Control: public, max-age=31536000, immutable\n```\n\n- Deploy command in the Cloudflare project: `npx wrangler deploy`. Build command: none.\n- Cloudflare **drops the `.html` ending**: `/privacy.html` answers with a 307 redirect to `/privacy`. Write links between pages as the clean addresses (`/privacy`, `/support`), not with `.html`.\n- Pull requests and branches get a build check (\"Workers Builds\") on the commit in GitHub, but they do not appear in the repository's Deployments list."}, {"heading": "3. Steps to repeat this yourself", "domains": ["web", "ops"], "parts": ["stack-rules"], "text": "## 3. Steps to repeat this yourself\n\n0. **Prerequisite:** having bought a domain at Cloudflare Registrar (Domain Registration in the dashboard), check that it appears in your account with auto-renew on. Its DNS zone is already there.\n1. Put the site in a GitHub repository with `wrangler.jsonc` as above.\n2. Cloudflare dashboard \u2192 **Workers & Pages** \u2192 create a project from the Git repository. The project name must match `name` in `wrangler.jsonc`.\n3. Deploy command `npx wrangler deploy`; leave the build command empty.\n4. Push to `main` and check that the `*.workers.dev` address shows the site.\n5. Project \u2192 **Settings \u2192 Domains & Routes** \u2192 add your domain. Because the domain is registered at Cloudflare, its DNS is already there: Cloudflare creates the records and the certificate for you. (A domain bought elsewhere must first point its nameservers at Cloudflare.)\n6. Add `www` as well and make it redirect to the bare domain (one redirect rule, or a second custom domain plus a redirect **(check which one you used)**).\n7. Turn on \"Always use HTTPS\" and test with a private browser window.\n8. Turn **GitHub Pages off** (Settings \u2192 Pages \u2192 source: none) if you used it before, and delete the old `github-pages` environment if you want a clean repository."}, {"heading": "4. DNS and email on your own domain", "domains": ["web", "ops"], "parts": ["stack-rules"], "text": "## 4. DNS and email on your own domain\n\n- With the domain registered at Cloudflare, the DNS zone is in the same account, which is what makes the custom-domain step automatic. Records for mail (SPF, DKIM, DMARC) are added in the same **DNS \u2192 Records** page.\n- **Sending mail** from the domain (for example verification emails from an app) needs the sending service to verify the domain: add the SPF and DKIM records the service shows you, and a DMARC record. Without them, mail lands in spam or is refused.\n- **Receiving mail** for a public address such as `support@your-domain` without a mailbox: Cloudflare **Email Routing** forwards it to a real inbox. Test by sending a message from a different address and replying to it **(check how yours was set up)**.\n- Use one contact address everywhere (store listing, support page, privacy policy, app, review contact)."}, {"heading": "5. What is a Worker?", "domains": ["web", "ops"], "parts": ["stack-rules"], "text": "## 5. What is a Worker?\n\nA **Worker** is a small program (JavaScript or TypeScript, also Python) that runs on Cloudflare's servers close to the visitor, with no server for you to manage. A request arrives, your code runs, a response goes back.\n\nWhat we used is the simplest form: **static assets**. Cloudflare stores your files and serves them; no code of yours runs. The same project can later get a script (`\"main\": \"src/index.js\"` in `wrangler.jsonc`) that runs *before* the assets, for example to redirect or to answer an API call.\n\nOther things a Worker can do:\n\n| Use | How |\n|---|---|\n| Redirects and rewrites (old address \u2192 new address) | A few lines, or Redirect Rules in the dashboard without code |\n| Add or change headers on every response | In code, or the `_headers` file for static files |\n| Small API endpoints (a contact form, a counter) | A script with `fetch` handler; store data with KV, D1 (SQLite) or R2 |\n| Scheduled jobs | **Cron Triggers** run a script on a schedule |\n| Protect or speed up another server | A Worker (or plain DNS proxying) in front of your API can cache, rate-limit or filter |\n| Store files | **R2** (S3-compatible object storage, no egress fees); used here for photos behind the backend |\n\n**Limits on the free plan** include a daily request allowance and a short CPU time per request **(check current numbers: Cloudflare's pricing page)**. A static site is served without counting against script limits; scripts count.\n\n### Putting Cloudflare in front of an API: pros and cons\n\n| | Pros | Cons |\n|---|---|---|\n| **Proxy the API through Cloudflare** (the domain's DNS record points to the API host with the proxy switched on) | Absorbs floods before they reach your server; hides the real address if you lock the origin down; one place for rate-limit and bot rules; caching for public endpoints | The API address changes (apps need an update); an extra hop; features such as advanced rate limiting can need a paid plan **(check)**; the app can still be reached directly unless the origin only accepts Cloudflare |\n| **Write a Worker that forwards requests to the API** | Full control in code (custom limits, header checks, logging) | You maintain code; counts toward Worker request limits; easy to get IP and header handling wrong |\n| **Leave the API as it is** | Nothing to change, no cost | Per-IP limits can be faked if the code trusts headers Cloudflare would have set; floods reach the server |\n\nWhatever you choose, never trust `CF-Connecting-IP` or `X-Forwarded-For` unless **your own proxy** sets them (see `checklists/login-security-checklist.md`)."}, {"heading": "6. Gotchas we hit", "domains": ["web", "ops"], "parts": ["stack-rules"], "text": "## 6. Gotchas we hit\n\n- **A merge re-published the old site.** \"Unpublish\" on GitHub Pages only took the site down; the source setting remained, so the next merge to `main` rebuilt it. Set the Pages source to none, or delete the Pages site with the API.\n- **Deployments list is stale.** Old `github-pages` deployments stay until the `github-pages` environment is deleted.\n- **`.html` links.** Links with `.html` cause an extra redirect.\n- **Project name mismatch.** If the `name` in `wrangler.jsonc` does not match the Cloudflare project, the deploy fails."}]}, {"path": "hosting/custom-domain-cloudflare-to-render.md", "title": "Domain at Cloudflare, site on Render", "adapt": "Replace example.com / my-service. Only if hosting on Render.", "sections": [{"heading": "", "domains": ["web", "ops"], "parts": ["playbooks"], "text": "# Domain at Cloudflare, site on Render\n\nThe steps followed for several projects: the domain was bought at, and its DNS lives at, **Cloudflare**, and the site or service runs on **Render**. Examples used here: `example.com` (the domain) and `my-service` (the Render service). Screens change, so items marked **(check)** need confirming in each dashboard.\n\nLast verified: 2026-10-18."}, {"heading": "1. What each service does", "domains": ["web", "ops"], "parts": ["playbooks"], "text": "## 1. What each service does\n\n| Service | Role |\n|---|---|\n| **Cloudflare Registrar** | Sells the domain at cost and keeps its DNS (the address book that says which server answers for the name) |\n| **Render** | Runs the site (a static site, or a web service in a Docker container) and gives it a certificate (the padlock, HTTPS) |\n\nCloudflare only points the name at Render. The files and the code stay on Render."}, {"heading": "2. Steps", "domains": ["web", "ops"], "parts": ["playbooks"], "text": "## 2. Steps\n\n1. **Prerequisite:** having bought a domain at Cloudflare Registrar (Domain Registration in the dashboard), check that it appears in your account. Its DNS zone is created automatically in the same account.\n2. **Deploy the project on Render** and open its address (`my
