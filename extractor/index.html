-service.onrender.com`) to check that it works before touching the domain.\n3. In Render, open the service \u2192 **Settings \u2192 Custom Domains \u2192 Add Custom Domain**. Add both `example.com` (the \"bare\" or apex domain) and `www.example.com`. Render shows the DNS target to use (the service's `onrender.com` host name).\n4. In Cloudflare \u2192 the domain \u2192 **DNS \u2192 Records**, add:\n\n   | Type | Name | Target | Proxy |\n   |---|---|---|---|\n   | CNAME | `www` | `my-service.onrender.com` | **DNS only** (grey cloud) |\n   | CNAME | `@` | `my-service.onrender.com` | **DNS only** (grey cloud) |\n\n   - A CNAME on the bare domain (`@`) is normally not allowed in DNS. Cloudflare allows it by **CNAME flattening** (it answers with the target's IP addresses). Other DNS providers use an ALIAS or ANAME record, or an A record to the IP address Render lists **(check Render's current instructions)**.\n   - Keep the records **DNS only** while Render verifies the domain and issues the certificate.\n5. Back in Render, press **Verify** next to each domain. Render then **issues a free TLS certificate** automatically; this usually takes minutes, sometimes longer **(check)**.\n6. Open `https://example.com` and `https://www.example.com`. One should redirect to the other; Render does this for you when both are added **(check which way it redirects)**.\n7. Update everything that contains the address: the app or site's own base-URL setting, links in emails, the privacy policy, the store listing, and canonical tags on the pages."}, {"heading": "3. Optional: turn on Cloudflare's proxy afterwards", "domains": ["web", "ops"], "parts": ["playbooks"], "text": "## 3. Optional: turn on Cloudflare's proxy afterwards\n\nSwitching the records to **Proxied** (orange cloud) puts Cloudflare in front of Render: DDoS protection, caching, rules.\n\n- Set Cloudflare **SSL/TLS mode to Full (strict)** first, so the connection between Cloudflare and Render stays encrypted and verified **(check)**.\n- Only then trust Cloudflare's `CF-Connecting-IP` header, and only for traffic that really arrives through the proxy. The service is still reachable directly at its `onrender.com` address, where that header can be faked (see `checklists/login-security-checklist.md`).\n- Proxying can interfere with certificate renewal on some setups; if a certificate fails to renew, switch the record to DNS only and verify again **(check)**."}, {"heading": "4. Two ways to host the same domain", "domains": ["web", "ops"], "parts": ["playbooks"], "text": "## 4. Two ways to host the same domain\n\n| | **Cloudflare Workers (static assets)** | **Render (static site or web service)** |\n|---|---|---|\n| Good for | Plain HTML/CSS sites, redirects, tiny APIs | Anything with a server: APIs, Docker apps, databases next to it |\n| Domain setup | One step in the Cloudflare project; DNS records are created for you | Records added by hand in Cloudflare, then Verify in Render |\n| Cost | Free for static files (limits apply **(check)**) | Static sites are free **(check)**; web services have a paid plan with a fixed monthly price |\n| Deploys | Push to `main` | Push to the deploy branch (auto-deploy) |\n| Watch out for | The `.html` redirect, project name must match | Free services sleep (slow first request); no spending cap; a merge is a deploy |\n\nBoth can use the same Cloudflare-registered domain, even in the same account: for example one site on Workers and another on Render. See `cloudflare-workers-and-domains.md` for the Workers path."}, {"heading": "5. Check list after setup", "domains": ["web", "ops"], "parts": ["playbooks"], "text": "## 5. Check list after setup\n\n- [ ] Both `https://example.com` and `https://www.example.com` open with a valid padlock.\n- [ ] The `http://` versions redirect to `https://`.\n- [ ] One address is the main one; the other redirects.\n- [ ] The old `onrender.com` address is no longer used in links, emails or settings.\n- [ ] Email for the domain (sending and receiving) is set up separately; see section 4 of `cloudflare-workers-and-domains.md`.\n- [ ] A reminder in the calendar for the domain renewal date; keep auto-renew on and a valid card."}]}, {"path": "hosting/render-backend.md", "title": "Backend on Render with Atlas, R2 and email: what we run and what it costs to watch", "adapt": "Stack-specific (Java, Atlas, R2, Brevo). Take section 3 'Operations lessons' if using Render; skip 1-2 otherwise.", "sections": [{"heading": "", "domains": ["backend", "ops"], "parts": ["stack-rules"], "text": "# Backend on Render with Atlas, R2 and email: what we run and what it costs to watch\n\nA small Java (Spring Boot) API for a mobile app, run as one service. This describes the setup and the operating lessons, without secrets. Replace the names with your own.\n\nLast verified: 2026-10-18."}, {"heading": "1. The pieces", "domains": ["backend", "ops"], "parts": ["reference"], "text": "## 1. The pieces\n\n| Piece | Service | Notes |\n|---|---|---|\n| API | **Render** web service (Docker), one fixed-price instance, region close to your users | Health check path `/actuator/health`; auto-deploy on every push to the deploy branch |\n| Database | **MongoDB Atlas** | A paid tier gives automatic daily backups; the free tier has none |\n| Photo storage | **Cloudflare R2** (private bucket) or the database (GridFS) | A setting chooses where *new* photos go; old ones stay readable |\n| Email | **Brevo** (SMTP) | Free plan has a daily send limit; the app also caps mail per day |\n| Uptime | **Better Stack** | Free plan: one monitor on the health endpoint; email alerts only |"}, {"heading": "2. Configuration rules", "domains": ["backend", "ops"], "parts": ["stack-rules"], "text": "## 2. Configuration rules\n\n- A `render.yaml` (\"Blueprint\") describes the service. Secrets are marked `sync: false` so their values are **never in the file or in git**; set them in the Render dashboard.\n- Generate the JWT signing secret once (`generateValue: true`) and keep it stable across deploys.\n- The server **refuses to start** with a development secret on a real host (see `checklists/login-security-checklist.md`).\n- Settings that choose behaviour (`UPLOAD_STORAGE`, migration flags) are set in the dashboard, not in the file, so a Blueprint sync never resets them.\n- One variable holds the service's own public URL; it is baked into email links, so update it if the assigned URL differs.\n- A mail sender address must be one your SMTP provider is allowed to send from (verify the domain with SPF/DKIM first)."}, {"heading": "3. Operations lessons", "domains": ["ops", "backend"], "parts": ["conventions"], "text": "## 3. Operations lessons\n\n- **Auto-deploy on merge means a merge is a deploy.** While an app is in store review, do not merge backend changes: the reviewer uses the live API.\n- **Render has no spending cap.** Keep one fixed-price instance and check the billing page and bandwidth emails weekly.\n- **Backups:** decide where they are and test a restore; the free database tier has none.\n- **Billing alerts** on every paid service (database, object storage, hosting) so a bug or attack cannot become a bill.\n- **Migrations that copy data** (database to R2): default off, dry run first, never delete the source.\n- **Monitoring:** one monitor on the health endpoint; add alerts on spikes of failed logins and 429 responses.\n- **Cold starts:** a service that sleeps makes the first request slow; use an always-on instance for anything a reviewer or user must reach quickly.\n- **Is the API behind Cloudflare?** Here it was not (the app calls the Render address). Read `cloudflare-workers-and-domains.md` section 5 for what that means for rate limits."}]}, {"path": "workflow/board-and-cards.md", "title": "Board and cards (GitHub Projects)", "adapt": "Rename title prefixes to the new project's areas.", "sections": [{"heading": "", "domains": ["general"], "parts": ["conventions"], "text": "# Board and cards (GitHub Projects)\n\nA simple way to keep a solo or small-team project organised across several repositories, and to hand cards to AI assistants."}, {"heading": "Title prefixes", "domains": ["general"], "parts": ["conventions"], "text": "## Title prefixes\n\n| Prefix | Meaning |\n|---|---|\n| `[FE]` | App or front-end work |\n| `[BE]` | Backend work |\n| `[Owner]` | Something the owner must do (App Store Connect, billing, design, decisions) |\n| `[All]` | Needs more than one part (for example app and backend) |\n| `[Later]` | Not now; kept so it is not forgotten |\n\nWrite titles as what the result is, not the activity (\"Settings: choose an app icon\", not \"Work on icons\")."}, {"heading": "Fields", "domains": ["general"], "parts": ["conventions"], "text": "## Fields\n\n- **Status:** Backlog \u2192 Ready \u2192 In progress \u2192 In review \u2192 Done.\n- **Priority:** P0 (blocks a release), P1 (important), P2 (nice to have).\n- **Size:** XS, S, M, L, XL (relative effort, not hours)."}, {"heading": "What a good card contains", "domains": ["general"], "parts": ["conventions"], "text": "## What a good card contains\n\n- The goal in one or two sentences.\n- The decisions already made, with the date.\n- Concrete points to build or check (a short list).\n- Open questions, with who decides.\n- Constraints: \"not for the build that is in review\", \"do not deploy until the owner says\".\n- Links to related cards.\n\nUse \"**after approval**\" or \"**for release X**\" in the text, not only in your head, when work must wait."}, {"heading": "Draft cards vs issues", "domains": ["general"], "parts": ["conventions"], "text": "## Draft cards vs issues\n\n- **Draft cards** live only on the board. Good for owner tasks and early ideas.\n- **Issues** live in a repository and can be linked to pull requests. Use them when code is involved.\n- Keep a release card per version with a numbered checklist, and link the feature cards from it."}, {"heading": "Command line tips (`gh`)", "domains": ["general"], "parts": ["conventions"], "text": "## Command line tips (`gh`)\n\n- Create a draft card: `gh project item-create <number> --owner <user> --title \"...\" --body \"...\"`.\n- Add an existing issue: `gh project item-add <number> --owner <user> --url <issue-url>`.\n- Set a single-select field by name: `gh project item-edit <number> --owner <user> --url <issue-url> --field \"Status\" --value \"Backlog\"`. For **draft cards** there is no URL; use the item id with `--id`, `--project-id`, `--field-id` and `--single-select-option-id`.\n- Edit a draft's text with `--id <draft-issue-id>` and `--title` or `--body`; the draft id is not the same as the project item id.\n- In shell scripts, do not reuse positional variables (`$1`, `$2`) for other values inside a function; it silently breaks the next call. A small Python script that calls `gh` is easier to get right.\n- One field can be changed per call for non-draft items."}, {"heading": "Handing a card to an assistant", "domains": ["general"], "parts": ["conventions"], "text": "## Handing a card to an assistant\n\nUse `agent-briefing-template.md`. Say which branch to use, what not to touch, and when to report back."}]}]};const $=i=>document.getElementById(i);
for(const [k,v] of Object.entries(DATA.domains))$("d").insertAdjacentHTML("beforeend",`<label><input type=checkbox value="${k}" ${k=="general"?"checked":""}> <b>${k}</b> <small>${v}</small></label>`);
for(const [k,v] of Object.entries(DATA.parts))$("p").insertAdjacentHTML("beforeend",`<label><input type=checkbox value="${k}"> <b>${k}</b> <small>${v}</small></label>`);
const ticked=id=>[...$(id).querySelectorAll("input:checked")].map(x=>x.value);
function build(){const d=ticked("d"),p=ticked("p");let nf=0,out=`<!-- Extracted from everything-mds. domains: ${d.join(", ")||"all"}; parts: ${p.join(", ")||"all"}. Adapt names/paths; delete what does not apply. -->\n`;
const parts=[];for(const f of DATA.files){const s=f.sections.filter(s=>(!d.length||s.domains.some(x=>d.includes(x)))&&(!p.length||s.parts.some(x=>p.includes(x))));
if(s.length){nf++;parts.push(`# ${f.title}\n\n<!-- from everything-mds: ${f.path}${f.adapt?" | adapt: "+f.adapt:""} -->\n`+s.map(x=>x.text).join("\n\n")+"\n")}}
$("n").textContent=nf+" files";return out+"\n"+parts.join("\n---\n\n")}
function show(){$("pv").textContent=build()}document.querySelectorAll("input").forEach(i=>i.onchange=show);show();
$("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([build()],{type:"text/markdown"}));a.download="everything-mds-extract.md";a.click()};
$("cp").onclick=()=>navigator.clipboard.writeText(build());</script></body></html>
